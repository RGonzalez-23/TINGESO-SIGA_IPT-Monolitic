services:
  # =========================================================================
  # 1. Base de Datos Relacional (PostgreSQL con volumen persistente)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - siga_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - siga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Servidor de Identidad y Accesos (Keycloak IAM)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: siga-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - siga-network
    depends_on:
      postgres:
        condition: service_healthy

  # =========================================================================
  # 3. Tres Réplicas del Backend (Spring Boot)
  # =========================================================================
  backend-1:
    image: ${DOCKER_HUB_BACKEND_IMAGE:-rgonzalez23/siga-backend:latest}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: siga-backend-1
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/siga_ipt_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/siga-ipt-realm/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: siga-ipt-realm
      KEYCLOAK_CLIENT_ID: siga-backend-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_DEFAULT_PASSWORD: ${KEYCLOAK_DEFAULT_PASSWORD}
    networks:
      - siga-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend-2:
    image: ${DOCKER_HUB_BACKEND_IMAGE:-rgonzalez23/siga-backend:latest}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: siga-backend-2
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/siga_ipt_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/siga-ipt-realm/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: siga-ipt-realm
      KEYCLOAK_CLIENT_ID: siga-backend-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_DEFAULT_PASSWORD: ${KEYCLOAK_DEFAULT_PASSWORD}
    networks:
      - siga-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend-3:
    image: ${DOCKER_HUB_BACKEND_IMAGE:-rgonzalez23/siga-backend:latest}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: siga-backend-3
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/siga_ipt_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/siga-ipt-realm/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: siga-ipt-realm
      KEYCLOAK_CLIENT_ID: siga-backend-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_DEFAULT_PASSWORD: ${KEYCLOAK_DEFAULT_PASSWORD}
    networks:
      - siga-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # =========================================================================
  # 4. Única Instancia del Frontend (React + Vite)
  # =========================================================================
  frontend:
    image: ${DOCKER_HUB_FRONTEND_IMAGE:-rgonzalez23/siga-frontend:latest}
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_KEYCLOAK_URL: ${FRONTEND_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: siga-ipt-realm
        VITE_KEYCLOAK_CLIENT_ID: siga-frontend
    container_name: siga-frontend
    restart: unless-stopped
    networks:
      - siga-network
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  # =========================================================================
  # 5. Balanceador de Carga Nginx (Entrada pública puerto 80)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: siga-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - siga-network
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend

# =========================================================================
# Volúmenes Persistentes y Red Compartida
# =========================================================================
volumes:
  siga_pgdata:
    name: siga_pgdata

networks:
  siga-network:
    name: siga-network
    driver: bridge
