spring.application.name=siga-ipt-test

# H2 Database in-memory configuration with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keycloak Admin Mock/Test Configuration
keycloak.server-url=http://localhost:8080
keycloak.realm=siga-ipt-realm
keycloak.client-id=siga-backend-service
keycloak.client-secret=test-secret
keycloak.default-password=Siga2026!

