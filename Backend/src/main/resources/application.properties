spring.application.name=siga-ipt
server.port=${BACKEND_PORT}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://${KEYCLOAK_URL}/realms/siga-ipt-realm/protocol/openid-connect/certs}

# Keycloak Admin Service Configuration
keycloak.server-url=${KEYCLOAK_URL}
keycloak.realm=${KEYCLOAK_REALM:siga-ipt-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:siga-backend-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.default-password=${KEYCLOAK_DEFAULT_PASSWORD}


