spring.application.name=siga-ipt
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/siga_ipt_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/siga-ipt-realm

# Keycloak Admin Service Configuration
keycloak.server-url=http://localhost:8080
keycloak.realm=siga-ipt-realm
keycloak.client-id=siga-backend-service
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:8nHa3PI6wZmbASze6yrHprpJdEKT16Ug}
keycloak.default-password=Siga2026!


